name: Bug report
description: Report a reproducible problem without sharing private recordings or secrets.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include API keys, audio, transcript text, user databases, or personal paths.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows/.NET environment
      placeholder: Windows build, x64, app commit/tag
    validations:
      required: true
