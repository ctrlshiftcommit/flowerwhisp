name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate local Whisper protocol and schemas
        shell: pwsh
        run: |
          python tools/local-whisper-host/test_protocol.py
          python -m pip install --disable-pip-version-check --quiet jsonschema
          python -c "import json; from pathlib import Path; from jsonschema import Draft202012Validator; [Draft202012Validator.check_schema(json.loads(p.read_text(encoding='utf-8'))) for p in Path('schemas').glob('*.schema.json')]; print('JSON schemas: PASS')"
      - name: Restore
        run: dotnet restore FlowerWhisp.slnx
      - name: Build
        run: dotnet build FlowerWhisp.slnx --configuration Release --arch x64 --no-restore
      - name: Test
        run: dotnet test tests\FlowerWhisp.Tests\FlowerWhisp.Tests.csproj --configuration Release --no-restore --logger "trx;LogFileName=test-results.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
