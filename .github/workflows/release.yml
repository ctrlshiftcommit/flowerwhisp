name: Release packages

on:
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and sign (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  # Every PR gets an installable package artifact for review. It is explicitly
  # unsigned and is never published as a release.
  unsigned-pr-msix:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore and build unsigned MSIX
        shell: pwsh
        run: |
          dotnet restore FlowerWhisp.slnx
          dotnet test tests\FlowerWhisp.Tests\FlowerWhisp.Tests.csproj --configuration Release --no-restore
          dotnet publish FlowerWhisp.csproj --configuration Release --runtime win-x64 --self-contained true `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxPackageSigningEnabled=false `
            -p:AppxPackageDir="$pwd\artifacts\pr-msix\" `
            --output "$pwd\artifacts\pr-publish"
          $packages = @(Get-ChildItem artifacts -Recurse -File | Where-Object { $_.Extension -in '.msix', '.appx', '.msixbundle', '.appxbundle' })
          if (-not $packages) { throw 'Unsigned PR MSIX build produced no MSIX/AppX package.' }
          $packages | ForEach-Object { Write-Host "Unsigned package: $($_.FullName)" }
      - uses: actions/upload-artifact@v7
        with:
          name: flowerwhisp-pr-unsigned-msix
          path: artifacts
          if-no-files-found: error

  signed-release-msix:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore, test, and build unsigned package
        shell: pwsh
        run: |
          dotnet restore FlowerWhisp.slnx
          dotnet test tests\FlowerWhisp.Tests\FlowerWhisp.Tests.csproj --configuration Release --no-restore
          dotnet publish FlowerWhisp.csproj --configuration Release --runtime win-x64 --self-contained true `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxPackageSigningEnabled=false `
            -p:AppxPackageDir="$pwd\artifacts\unsigned\" `
            --output "$pwd\artifacts\publish"
          $packages = @(Get-ChildItem artifacts -Recurse -File | Where-Object { $_.Extension -in '.msix', '.appx', '.msixbundle', '.appxbundle' })
          if (-not $packages) { throw 'Release build produced no MSIX/AppX package.' }
          New-Item -ItemType Directory -Force artifacts\release | Out-Null
          $packages | Copy-Item -Destination artifacts\release -Force
      - name: Require signing secrets and sign MSIX only
        shell: pwsh
        env:
          SIGNING_CERT_BASE64: ${{ secrets.SIGNING_CERT_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_CERT_BASE64) -or [string]::IsNullOrWhiteSpace($env:SIGNING_CERT_PASSWORD)) { throw 'Signing secrets are absent; refusing to publish an unsigned release.' }
          $certificate = Join-Path $pwd 'signing.pfx'
          try {
            [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:SIGNING_CERT_BASE64))
            $packages = @(Get-ChildItem artifacts\release -File | Where-Object { $_.Extension -in '.msix', '.appx', '.msixbundle', '.appxbundle' })
            if (-not $packages) { throw 'No MSIX/AppX package was produced for signing.' }
            foreach ($package in $packages) {
              & signtool sign /fd SHA256 /f $certificate /p $env:SIGNING_CERT_PASSWORD $package.FullName
              if ($LASTEXITCODE -ne 0) { throw "Signing failed for $($package.Name)." }
            }
          }
          finally { Remove-Item $certificate -Force -ErrorAction SilentlyContinue }
      - name: Generate checksums
        shell: pwsh
        run: Get-ChildItem artifacts\release -File | Get-FileHash -Algorithm SHA256 | ConvertTo-Csv -NoTypeInformation | Set-Content artifacts\SHA256SUMS.csv
      - uses: actions/upload-artifact@v7
        with:
          name: flowerwhisp-${{ inputs.tag }}-win-x64
          path: artifacts\release
          if-no-files-found: error
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ inputs.tag }}" artifacts\release\* artifacts\SHA256SUMS.csv --generate-notes --verify-tag
